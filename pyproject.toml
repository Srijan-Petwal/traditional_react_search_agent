description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Srijan-Petwal", email = "srijan8a@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "langchain>=1.4.0",
    "langchain-classic>=1.0.8",
    "langchain-google-genai>=4.4.0",
